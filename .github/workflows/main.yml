name: SMC Hybrid Analyst Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '13 */6 * * *'

concurrency:
  group: smc-telegram-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set +e
          timeout --signal=INT --kill-after=30s 5h50m python -u main.py
          STATUS=$?

          if [ "$STATUS" -eq 124 ] || [ "$STATUS" -eq 130 ]; then
            echo "Bot selesai sesuai jadwal."
            exit 0
          fi

          exit "$STATUS"
